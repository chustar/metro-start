name: Build Metro Start

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metro-start
    steps:
    - name: Checkout Metro Start
      uses: actions/checkout@v4
      with:
        path: metro-start
    - name: Checkout Metro Select
      uses: actions/checkout@v4
      with:
        repository: metro-start/metro-select
        path: metro-select
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - run: bun install --frozen-lockfile
    - run: bun run check
    - uses: actions/upload-artifact@v4
      with:
        name: metro-start-extensions
        path: metro-start/dist/*.zip
